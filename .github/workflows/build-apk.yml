name: Construir APK

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "versionCode (sube 1 en cada actualización: 1, 2, 3...)"
        default: "1"
        required: true
      version_name:
        description: "versionName (ej. 1.0.0, 1.0.1...)"
        default: "1.0.0"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://beticobetico.github.io/bloqdrop/
      APP_ID: com.beticobetico.bloqdrop
      SOLANA_MOBILE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      SOLANA_MOBILE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Preparar llave de firma
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ] || [ -z "$SOLANA_MOBILE_KEYSTORE_PASSWORD" ]; then
            echo "::error::Faltan los secrets ANDROID_KEYSTORE_BASE64 y/o ANDROID_KEYSTORE_PASSWORD"
            exit 1
          fi
          echo "$KS" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/release.keystore"
          keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass "$SOLANA_MOBILE_KEYSTORE_PASSWORD" | grep -i android

      - name: Generar proyecto Android
        run: |
          npx -y solana-mobile@latest webshell init android \
            --url "$SITE_URL" \
            --manifest "${SITE_URL}manifest.json" \
            --app-name "BloqDrop" \
            --application-id "$APP_ID" \
            --version-code "${{ inputs.version_code }}" \
            --version-name "${{ inputs.version_name }}" \
            --keystore-path "$RUNNER_TEMP/release.keystore" \
            --keystore-alias android < /dev/null

      - name: Construir APK firmado
        run: |
          npx -y solana-mobile@latest webshell build android \
            --keystore-path "$RUNNER_TEMP/release.keystore" \
            --keystore-alias android < /dev/null
          APK=android/app/build/outputs/apk/release/app-release.apk
          ls -la "$APK"
          SIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$SIGNER" verify --print-certs "$APK" || true
          cp "$APK" "bloqdrop-${{ inputs.version_name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: bloqdrop-apk-${{ inputs.version_name }}
          path: bloqdrop-*.apk
          if-no-files-found: error
