<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0716">
<title>BloqDrop</title>
<meta name="description" content="Juego de bloques que caen: encaja piezas, completa líneas y gana SKR cada día.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#0b0716;--panel:#140f26;--line:#2a2145;--txt:#ece7ff;--mut:#8d82b8;--pur:#9945FF;--grn:#14F195;--gold:#facc15}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:radial-gradient(120% 80% at 50% 0%,#1d1238 0%,var(--bg) 60%);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
button{font-family:inherit;cursor:pointer}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:520px;margin:0 auto;gap:8px;
  padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 10px) calc(env(safe-area-inset-bottom) + 10px) calc(env(safe-area-inset-left) + 10px)}
header{display:flex;align-items:center;gap:6px}
.brand{font-weight:900;letter-spacing:.3px;font-size:17px;white-space:nowrap}
.brand span,.grad{background:linear-gradient(90deg,var(--pur),var(--grn));-webkit-background-clip:text;background-clip:text;color:transparent}
.stats{display:flex;gap:5px;flex:1;justify-content:flex-end}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px 6px;min-width:50px;text-align:center}
.stat b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.stat small{font-size:8.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
.icon{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:10px;width:36px;height:36px;font-size:15px;flex:none;padding:0}
main{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;gap:8px}
#strip{display:flex;gap:8px;width:100%;align-items:stretch}
.side{display:flex;flex-direction:column;gap:4px;align-items:stretch}
#sideR{flex:1}
.lbl{font-size:9px;color:var(--mut);text-transform:uppercase;letter-spacing:1px;text-align:center}
.side canvas{background:var(--panel);border:1px solid var(--line);border-radius:10px;display:block}
.mini{background:var(--panel);border:1px solid var(--line);border-radius:10px;text-align:center;padding:6px 2px;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;flex:1;display:flex;align-items:center;justify-content:center}
#boardArea{flex:1;min-height:0;width:100%;display:flex;justify-content:center;align-items:flex-start}
#wrap{position:relative;border-radius:12px;overflow:hidden;box-shadow:0 0 0 1px var(--line),0 0 40px rgba(153,69,255,.25)}
#board{display:block}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(11,7,22,.86);backdrop-filter:blur(4px);text-align:center;padding:16px;overflow:auto}
#overlay.hide{display:none}
#overlay h1{margin:0;font-size:30px;font-weight:900}
#overlay p{margin:0;color:var(--mut);font-size:13px;line-height:1.5}
#overlay .big{font-size:34px;font-weight:900;color:var(--txt)}
.cta{border:0;border-radius:12px;padding:12px 26px;font-weight:800;font-size:16px;color:#0b0716;background:linear-gradient(90deg,var(--pur),var(--grn));min-width:180px}
.ghostbtn{background:transparent;border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:10px 18px;font-weight:700;font-size:14px;min-width:180px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.row .ghostbtn{min-width:0}
.prize{background:linear-gradient(90deg,rgba(250,204,21,.14),rgba(20,241,149,.12));border:1px solid rgba(250,204,21,.4);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:700;color:#fff}
.prize b{color:var(--gold)}
.status{font-size:13px;font-weight:700;min-height:18px}
.ok{color:var(--grn)}.warn{color:var(--gold)}.err{color:#fb7185}
.tiny{font-size:11px;color:var(--mut)}
.tiny a{color:var(--mut)}
#toast{position:absolute;left:0;right:0;top:30%;text-align:center;font-weight:900;font-size:26px;pointer-events:none;opacity:0;color:var(--grn);text-shadow:0 0 18px rgba(20,241,149,.6)}
#toast.show{animation:pop .9s ease-out}
@keyframes pop{0%{opacity:0;transform:scale(.6)}20%{opacity:1;transform:scale(1.1)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translateY(-30px)}}
#controls{display:grid;grid-template-columns:repeat(4,1fr);grid-template-areas:"l r cc cw" "sd hd hold hold";gap:8px}
#controls button{height:58px;border-radius:14px;border:1px solid var(--line);background:linear-gradient(180deg,#1c1535,#120d22);color:var(--txt);font-size:22px;font-weight:800;touch-action:none}
#controls button.on{background:linear-gradient(180deg,#3a2470,#24164a);border-color:var(--pur);transform:scale(.97)}
#controls .txt{font-size:13px;letter-spacing:1px}
/* modales */
.modal{position:fixed;inset:0;z-index:20;display:flex;justify-content:center;background:rgba(5,3,12,.7);backdrop-filter:blur(6px)}
.modal.hide{display:none}
.sheet{width:100%;max-width:520px;height:100%;background:var(--bg);display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 14px)}
.sheet h2{margin:0;font-size:20px;font-weight:900;flex:1}
.shead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.tabs{display:flex;gap:6px;margin:8px 0}
.tabs button{flex:1;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--mut);font-weight:800}
.tabs button.on{color:var(--txt);border-color:var(--pur);background:#24164a}
.list{flex:1;overflow:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.item:last-child{border-bottom:0}
.item .pos{width:30px;font-weight:900;color:var(--mut);text-align:center}
.item .who{flex:1;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px}
.item .pts{font-weight:900}
.item .lv{font-size:11px;color:var(--mut);width:46px;text-align:right}
.item.me{background:rgba(153,69,255,.18)}
.item.p1 .pos{color:var(--gold)}.item.p2 .pos{color:#cbd5e1}.item.p3 .pos{color:#fb923c}
.empty{padding:30px 16px;text-align:center;color:var(--mut);font-size:14px;line-height:1.6}
.winner{border:1px solid rgba(250,204,21,.45);background:rgba(250,204,21,.08);border-radius:12px;padding:12px;margin-bottom:8px;font-size:13px}
.winner code{display:block;word-break:break-all;font-size:12.5px;margin:6px 0;color:#fff}
.smallbtn{border:1px solid var(--line);background:var(--panel);color:var(--txt);border-radius:9px;padding:6px 12px;font-weight:700;font-size:12px}
.wlist{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.wbtn{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--txt);font-weight:800;font-size:15px;text-align:left}
.wbtn img{width:32px;height:32px;border-radius:8px}
input.addr{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0f0a1e;color:var(--txt);font-family:ui-monospace,Menlo,monospace;font-size:13px;user-select:text;-webkit-user-select:text}
.sheet p{color:var(--mut);font-size:13.5px;line-height:1.5;margin:6px 0}
.chip{font-family:ui-monospace,Menlo,monospace}
.sharebtn{border:0;border-radius:12px;padding:11px 22px;font-weight:800;font-size:15px;color:#0b0716;background:linear-gradient(90deg,#facc15,#fb923c);min-width:180px}
#shImg{width:100%;max-width:340px;align-self:center;border-radius:14px;border:1px solid var(--line);display:block;margin:4px auto 12px}
.shgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.shgrid button,.shgrid a{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--txt);font-weight:800;font-size:14px;text-decoration:none}
.shgrid .wide{grid-column:1/-1;border:0;color:#0b0716;background:linear-gradient(90deg,var(--pur),var(--grn))}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">Bloq<span>Drop</span></div>
    <div class="stats">
      <div class="stat"><b id="score">0</b><small>Puntos</small></div>
      <div class="stat"><b id="level">1</b><small>Nivel</small></div>
      <div class="stat"><b id="lines">0</b><small>Líneas</small></div>
    </div>
    <button class="icon" id="lbBtn" aria-label="Ranking">🏆</button>
    <button class="icon" id="muteBtn" aria-label="Sonido">🔊</button>
    <button class="icon" id="pauseBtn" aria-label="Pausa">❚❚</button>
  </header>

  <main id="play">
    <div id="strip">
      <div class="side"><div class="lbl">Guardado</div><canvas id="hold"></canvas></div>
      <div class="side" id="bestBox"><div class="lbl">Récord</div><div class="mini" id="best">0</div></div>
      <div class="side" id="sideR"><div class="lbl">Siguiente</div><canvas id="next"></canvas></div>
    </div>
    <div id="boardArea">
      <div id="wrap">
        <canvas id="board"></canvas>
        <div id="toast"></div>
        <div id="overlay"></div>
      </div>
    </div>
  </main>

  <div id="controls">
    <button data-act="left" style="grid-area:l" aria-label="Izquierda">◀</button>
    <button data-act="right" style="grid-area:r" aria-label="Derecha">▶</button>
    <button data-act="rotl" style="grid-area:cc" aria-label="Girar izquierda">↺</button>
    <button data-act="rotr" style="grid-area:cw" aria-label="Girar derecha">↻</button>
    <button data-act="down" style="grid-area:sd" aria-label="Bajar">▼</button>
    <button data-act="drop" style="grid-area:hd" aria-label="Caída rápida">⤓</button>
    <button data-act="hold" style="grid-area:hold" class="txt">GUARDAR</button>
  </div>
</div>

<!-- Ranking -->
<div class="modal hide" id="lbModal">
  <div class="sheet">
    <div class="shead"><h2>🏆 Ranking diario</h2><button class="icon" data-close="lbModal" aria-label="Cerrar">✕</button></div>
    <div class="prize" id="lbPrize"></div>
    <div class="tabs"><button data-tab="today" class="on">Hoy</button><button data-tab="yesterday">Ayer</button></div>
    <div id="lbTop"></div>
    <div class="list" id="lbList"><div class="empty">Cargando…</div></div>
    <p class="tiny" style="text-align:center;margin-top:10px"><a href="reglas.html">Reglas del concurso</a> · <a href="terminos.html">Términos</a> · <a href="privacidad.html">Privacidad</a></p>
  </div>
</div>

<!-- Compartir -->
<div class="modal hide" id="shModal">
  <div class="sheet" style="overflow:auto;touch-action:pan-y">
    <div class="shead"><h2>📤 Compartir puntaje</h2><button class="icon" data-close="shModal" aria-label="Cerrar">✕</button></div>
    <img id="shImg" alt="Tu puntaje en BloqDrop">
    <div class="shgrid" id="shBtns"></div>
    <div class="status" id="shMsg" style="margin-top:10px;text-align:center"></div>
  </div>
</div>

<!-- Wallet -->
<div class="modal hide" id="wModal">
  <div class="sheet">
    <div class="shead"><h2>Tu wallet</h2><button class="icon" data-close="wModal" aria-label="Cerrar">✕</button></div>
    <div id="wBody"></div>
  </div>
</div>

<script src="engine.js"></script>
<script>
(()=>{
// ================== CONFIGURACIÓN ==================
const CONFIG={
  API_URL:'https://ddrnkqmnoxknyotgbbnn.supabase.co/functions/v1/bloqdrop',
  PRIZE:'100 SKR',            // premio diario para el #1
  APP_URL:'https://beticobetico.github.io/bloqdrop/'
};
// ===================================================
const E=window.BloqEngine, A=E.ACTIONS, COLS=E.COLS, ROWS=E.ROWS, STEP=1000/E.TPS;
const COLORS={I:'#22d3ee',J:'#3b82f6',L:'#fb923c',O:'#facc15',S:'#14F195',T:'#9945FF',Z:'#f43f5e'};
const LINE_TXT=['','SENCILLA','¡DOBLE!','¡TRIPLE!','¡CUÁDRUPLE!'];
const DAS=160, ARR=45, SOFT_ARR=35;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const short=a=>a?a.slice(0,4)+'…'+a.slice(-4):'';
const boardC=$('board'),bctx=boardC.getContext('2d'),holdC=$('hold'),hctx=holdC.getContext('2d'),nextC=$('next'),nctx=nextC.getContext('2d');
const overlay=$('overlay'),toast=$('toast'),wrap=$('wrap');
let CELL=24,SIDE=70,STRIPH=50,NEXTW=200;

// ---------- almacenamiento local ----------
const store={get(k,d){try{const v=localStorage.getItem('bloqdrop_'+k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem('bloqdrop_'+k,v)}catch(e){}}};
let best=parseInt(store.get('best','0'),10)||0;
let wallet=store.get('wallet','')||'';

// ---------- sonido / vibración ----------
let ac=null,muted=store.get('muted','0')==='1';
function ensureAudio(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume().catch(()=>{})}
function tone(f,d=.06,type='square',v=.05,when=0){if(!ac||muted)return;const t=ac.currentTime+when,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.02)}
const SFX={move:()=>tone(240,.025,'square',.025),rot:()=>tone(460,.05,'triangle',.05),lock:()=>tone(120,.07,'square',.04),drop:()=>tone(150,.1,'sawtooth',.05),hold:()=>tone(330,.07,'sine',.07),
  clear:n=>[523,659,784,1046].slice(0,n).forEach((f,i)=>tone(f,.14,'triangle',.07,i*.06)),level:()=>[659,784,988,1318].forEach((f,i)=>tone(f,.1,'square',.04,i*.07)),over:()=>[392,330,262,196].forEach((f,i)=>tone(f,.22,'sawtooth',.05,i*.16))};
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}
function updateMute(){$('muteBtn').textContent=muted?'🔇':'🔊'}updateMute();

// ---------- API ----------
async function api(body,timeout=8000){
  if(!CONFIG.API_URL)throw new Error('no_api');
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),timeout);
  try{
    const r=await fetch(CONFIG.API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:ctl.signal});
    const j=await r.json().catch(()=>({error:'respuesta_invalida'}));
    if(!r.ok&&!j.error)j.error='http_'+r.status;
    return j;
  }finally{clearTimeout(t)}
}

// ---------- estado del juego ----------
let g=null,log=[],session=null,ranked=false,state='menu',acc=0,submitted=false,pendingSubmit=false,lastResult=null;

async function newGame(){
  state='loading';held={};
  showOverlay(`<p>Preparando partida…</p>`);
  let seed=null;session=null;
  if(CONFIG.API_URL){try{const r=await api({action:'start'},4000);if(r&&r.session){session=r.session;seed=r.seed}}catch(e){}}
  if(seed===null)seed=(Math.random()*4294967296)>>>0;
  g=new E.Game(seed);log=[];ranked=!!session;submitted=false;pendingSubmit=false;lastResult=null;acc=0;
  state='play';hideOverlay();updateHUD();last=performance.now();
  if(CONFIG.API_URL&&!ranked)showToast('MODO PRÁCTICA');
}
function act(code){
  if(state!=='play'||!g)return false;
  const t=g.tick;
  if(g.act(code)){log.push(t,code);return true}
  return false;
}
function handleEvents(){
  for(const ev of g.events){
    switch(ev.t){
      case'move':SFX.move();break;
      case'rot':SFX.rot();buzz(8);break;
      case'drop':SFX.drop();buzz(20);break;
      case'hold':SFX.hold();buzz(10);break;
      case'lock':SFX.lock();break;
      case'clear':SFX.clear(ev.n);buzz(ev.n>=4?[30,40,60]:25);break;
      case'lines':{let msg=LINE_TXT[ev.n];if(ev.combo>0)msg+=` COMBO x${ev.combo}`;
        if(ev.levelUp){msg=`NIVEL ${g.level}`;SFX.level()}
        if(ev.n>=2||ev.combo>0||ev.levelUp)showToast(msg);break}
      case'perfect':showToast('¡TABLERO LIMPIO!');break;
    }
  }
  g.events.length=0;updateHUD();
}
function gameOver(){
  state='over';held={};
  const record=g.score>best;if(record){best=g.score;store.set('best',String(best))}
  SFX.over();buzz([60,60,120]);updateHUD();
  showOverlay(`<h1>Fin del juego</h1><div class="big">${g.score.toLocaleString('es')}</div>
   <p>${record?'🏆 ¡Nuevo récord personal!':'Récord: '+best.toLocaleString('es')}<br>Nivel ${g.level} · ${g.lines} líneas</p>
   <div class="status" id="rankStatus"></div>
   <button class="cta" data-o="new">Jugar de nuevo</button>
   <button class="sharebtn" data-o="share">📤 Compartir puntaje</button>
   <div class="row"><button class="ghostbtn" data-o="board">🏆 Ranking</button><button class="ghostbtn" data-o="wallet" id="wChip"></button></div>`);
  renderWalletChip();
  submitResult();
}
function setStatus(html,cls=''){const el=$('rankStatus');if(el){el.className='status '+cls;el.innerHTML=html}}
async function submitResult(){
  if(state!=='over'||submitted)return;
  if(!CONFIG.API_URL){setStatus('');return}
  if(!ranked){setStatus('Modo práctica: esta partida no cuenta para el ranking','warn');return}
  if(!wallet){pendingSubmit=true;setStatus(`Conecta tu wallet para entrar al ranking<br><button class="ghostbtn" style="margin-top:8px" data-o="wallet">Conectar wallet</button>`,'warn');return}
  submitted=true;pendingSubmit=false;setStatus('Verificando partida…');
  let r;try{r=await api({action:'submit',session,wallet,log},20000)}catch(e){r={error:'red'}}
  if(r&&r.ok){
    lastResult=r;
    setStatus(r.flagged?`✓ Enviada · #${r.rankApprox} hoy (en revisión)`:`✓ Verificada · vas #${r.rankApprox} hoy`,'ok');
  }else{
    const msgs={red:'Sin conexión. No se pudo enviar.',sesion_vencida:'La partida tardó demasiado en enviarse.',sesion_invalida:'Esta partida ya fue enviada.',limite_diario:'Llegaste al límite de envíos de hoy.',partida_invalida:'No se pudo verificar la partida.',tiempo_imposible:'No se pudo verificar la partida.'};
    setStatus(msgs[r&&r.error]||'Error al enviar. Intenta otra partida.','err');
    if(r&&r.error==='red')submitted=false;
  }
}
function pause(){if(state!=='play')return;state='pause';held={};
  showOverlay(`<h1>Pausa</h1><p>Puntos: ${g.score.toLocaleString('es')}</p><button class="cta" data-o="resume">Continuar</button><button class="ghostbtn" data-o="new">Reiniciar</button>`)}
function resume(){if(state!=='pause')return;state='play';hideOverlay();last=performance.now()}

// ---------- UI ----------
function updateHUD(){
  const s=g?g.score:0;
  $('score').textContent=s.toLocaleString('es');$('level').textContent=g?g.level:1;$('lines').textContent=g?g.lines:0;
  $('best').textContent=Math.max(best,s).toLocaleString('es');
}
function showOverlay(html){overlay.innerHTML=html;overlay.classList.remove('hide')}
function hideOverlay(){overlay.classList.add('hide')}
function showToast(t){toast.textContent=t;toast.classList.remove('show');void toast.offsetWidth;toast.classList.add('show')}
function menu(){
  state='menu';
  showOverlay(`<h1>Bloq<span class="grad">Drop</span></h1>
   <p>Encaja los bloques y completa líneas.<br>Cada 10 líneas sube el nivel.</p>
   ${CONFIG.API_URL?`<div class="prize">🏆 Premio diario: <b>${esc(CONFIG.PRIZE)}</b> al #1 del ranking</div>`:''}
   <button class="cta" data-o="new">Jugar</button>
   ${CONFIG.API_URL?`<div class="row"><button class="ghostbtn" data-o="board">🏆 Ranking</button><button class="ghostbtn" data-o="wallet" id="wChip"></button></div>`:''}
   <p class="tiny">Toca el tablero para girar · desliza para mover<br>Desliza rápido hacia abajo para soltar · arriba para guardar</p>
   ${CONFIG.API_URL?`<p class="tiny"><a href="reglas.html">Reglas del concurso</a></p>`:''}`);
  renderWalletChip();
}
function renderWalletChip(){document.querySelectorAll('#wChip').forEach(b=>{b.innerHTML=wallet?`👛 <span class="chip">${esc(short(wallet))}</span>`:'👛 Conectar wallet'})}
overlay.addEventListener('pointerdown',e=>{
  const b=e.target.closest('[data-o]');if(!b)return;e.stopPropagation();e.preventDefault();ensureAudio();
  const o=b.dataset.o;
  if(o==='new')newGame();else if(o==='resume')resume();else if(o==='board')openBoard();else if(o==='wallet')openWallet();else if(o==='share')openShare();
});
$('pauseBtn').addEventListener('click',()=>{ensureAudio();state==='play'?pause():state==='pause'&&resume()});
$('muteBtn').addEventListener('click',()=>{ensureAudio();muted=!muted;store.set('muted',muted?'1':'0');updateMute()});
$('lbBtn').addEventListener('click',()=>{if(state==='play')pause();openBoard()});

document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>closeModal(b.dataset.close)));

// ---------- Ranking ----------
let lbTab='today',lbData=null,cdTimer=null;
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{lbTab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x===b));loadBoard()}));
function openBoard(){openModal('lbModal');lbTab='today';document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x.dataset.tab==='today'));loadBoard()}
function stopCountdown(){clearInterval(cdTimer);cdTimer=null}
function prizeBanner(){
  const p=$('lbPrize');
  if(!lbData||lbTab!=='today'){p.innerHTML=`🏆 Premio diario: <b>${esc(CONFIG.PRIZE)}</b> al #1`;return}
  const left=Math.max(0,lbData.endsAt-Date.now()),h=Math.floor(left/3600e3),m=Math.floor(left%3600e3/60e3),s=Math.floor(left%60e3/1e3);
  p.innerHTML=`🏆 El #1 de hoy gana <b>${esc(CONFIG.PRIZE)}</b> · termina en <b>${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}</b>`;

async function loadBoard(){
  const list=$('lbList'),top=$('lbTop');top.innerHTML='';
  if(!CONFIG.API_URL){list.innerHTML='<div class="empty">El ranking estará disponible muy pronto.</div>';$('lbPrize').innerHTML=`🏆 Premio diario: <b>${esc(CONFIG.PRIZE)}</b>`;return}
  list.innerHTML='<div class="empty">Cargando…</div>';prizeBanner();
  let r;try{r=await api(lbTab==='today'?{action:'board'}:{action:'board',day:(lbData&&lbData.yesterday)||undefined},8000)}catch(e){r=null}
  if(!r||r.error){list.innerHTML='<div class="empty">No se pudo cargar el ranking. Revisa tu conexión.</div>';return}
  if(lbTab==='today'){lbData=r}else if(!lbData){lbData=r;r=await api({action:'board',day:r.yesterday}).catch(()=>null);if(!r||r.error){list.innerHTML='<div class="empty">No se pudo cargar.</div>';return}}
  const rows=r.top||[];
  stopCountdown();prizeBanner();if(lbTab==='today')cdTimer=setInterval(prizeBanner,1000);
  if(lbTab==='yesterday'&&rows[0]){
    top.innerHTML=`<div class="winner">🏆 <b>Ganador de ayer</b> (${esc(r.day)}) · ${rows[0].score.toLocaleString('es')} pts<code>${esc(rows[0].wallet)}</code><button class="smallbtn" id="copyW">Copiar dirección</button></div>`;
    $('copyW').onclick=async()=>{try{await navigator.clipboard.writeText(rows[0].wallet);$('copyW').textContent='¡Copiada!'}catch(e){$('copyW').textContent='No se pudo copiar'}};
  }
  if(!rows.length){list.innerHTML=`<div class="empty">${lbTab==='today'?'Nadie ha jugado hoy todavía.<br>¡Sé el primero y llévate el premio!':'No hubo partidas ayer.'}</div>`;return}
  list.innerHTML=rows.map((x,i)=>`<div class="item ${i<3?'p'+(i+1):''} ${x.wallet===wallet?'me':''}">
    <div class="pos">${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</div>
    <div class="who">${esc(short(x.wallet))}${x.wallet===wallet?' <span class="tiny">(tú)</span>':''}</div>
    <div class="lv">Nv ${x.level}</div><div class="pts">${x.score.toLocaleString('es')}</div></div>`).join('');
}

// ---------- Wallet ----------
const B58='123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
function isAddr(s){if(typeof s!=='string'||s.length<32||s.length>44)return false;let n=0n;for(const ch of s){const i=B58.indexOf(ch);if(i<0)return false;n=n*58n+BigInt(i)}let bytes=0;while(n>0n){n>>=8n;bytes++}let lead=0;for(const ch of s){if(ch==='1')lead++;else break}return bytes+lead===32}
let walletLib=null;
function loadWalletLib(){
  if(walletLib)return walletLib;
  walletLib=new Promise(res=>{const s=document.createElement('script');s.src='wallet.js';s.onload=()=>{try{window.BloqWallet.init({name:'BloqDrop',uri:CONFIG.APP_URL,icon:'icon-192.png'})}catch(e){}res(window.BloqWallet||null)};s.onerror=()=>res(null);document.head.appendChild(s)});
  return walletLib;
}
loadWalletLib();
function setWallet(a){wallet=a||'';store.set('wallet',wallet);renderWalletChip()}
async function openWallet(){
  openModal('wModal');const body=$('wBody');
  const W=await loadWalletLib();
  const render=()=>{
    const ws=W?W.list():[];
    body.innerHTML=`
     ${wallet?`<div class="winner">Conectada:<code>${esc(wallet)}</code><button class="smallbtn" id="wOut">Desconectar</button></div>`:`<p>Conecta tu wallet de Solana para que tus puntuaciones entren al ranking. Si ganas, el premio se envía a esta dirección.</p>`}
     <div class="wlist">${ws.map((w,i)=>`<button class="wbtn" data-w="${i}">${w.icon?`<img src="${esc(w.icon)}" alt="">`:'👛'}<span>${esc(w.name)}</span></button>`).join('')}</div>
     ${ws.length?'':`<p>No se detectó ninguna wallet en este navegador. Abre el juego desde el navegador de Solflare o Phantom, o usa la opción de abajo.</p>`}
     <p style="margin-top:14px">O pega tu dirección de Solana:</p>
     <input class="addr" id="wInput" placeholder="Tu dirección (ej. 7xKX…)" autocomplete="off" autocapitalize="off" spellcheck="false">
     <div class="row" style="margin-top:10px"><button class="cta" id="wSave" style="min-width:0;flex:1">Guardar dirección</button></div>
     <div class="status" id="wMsg" style="margin-top:8px"></div>
     <p class="tiny">Solo guardamos tu dirección pública. Nunca te pediremos tu frase secreta ni que firmes transacciones.</p>`;
    body.querySelectorAll('[data-w]').forEach(b=>b.onclick=async()=>{
      const w=ws[+b.dataset.w];$('wMsg').className='status';$('wMsg').textContent='Abriendo '+w.name+'…';
      try{const a=await W.connect(w);if(!isAddr(a))throw new Error('addr');done(a)}catch(e){$('wMsg').className='status err';$('wMsg').textContent='No se pudo conectar. Intenta de nuevo o pega tu dirección.'}
    });
    $('wSave').onclick=()=>{const a=$('wInput').value.trim();if(isAddr(a))done(a);else{$('wMsg').className='status err';$('wMsg').textContent='Esa no es una dirección de Solana válida.'}};
    const o=$('wOut');if(o)o.onclick=()=>{setWallet('');render()};
  };
  const done=a=>{setWallet(a);closeModal('wModal');if(pendingSubmit&&state==='over')submitResult()};
  render();
  if(W&&!openWallet.sub){openWallet.sub=W.onChange(()=>{if(!$('wModal').classList.contains('hide'))render()})}
}


// ---------- Compartir ----------
const SHARE_URL=CONFIG.APP_URL+'info.html';
let iconImg=null;
function loadIcon(){if(iconImg)return iconImg;iconImg=new Promise(res=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>res(null);im.src='icon-192.png'});return iconImg}
function shareText(){
  const s=g?g.score.toLocaleString('es'):'0';
  const rank=lastResult&&lastResult.ok&&!lastResult.flagged?` y voy #${lastResult.rankApprox} en el ranking de hoy`:'';
  return `🧱 Hice ${s} puntos en BloqDrop (nivel ${g?g.level:1})${rank}. ¿Me superas? 🏆 ${SHARE_URL}`;
}
async function makeShareImage(){
  const W=1080,H=1080,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  const bg=x.createRadialGradient(W*.75,H*.2,40,W*.6,H*.4,W);bg.addColorStop(0,'#2c1858');bg.addColorStop(.55,'#120a26');bg.addColorStop(1,'#0b0716');x.fillStyle=bg;x.fillRect(0,0,W,H);
  // tablero final a la derecha
  const cs=40,bw=cs*COLS,bh=cs*ROWS,bx=W-bw-70,by=(H-bh)/2;
  x.save();x.fillStyle='#100b1f';rr(x,bx-10,by-10,bw+20,bh+20,22);x.fill();x.strokeStyle='rgba(153,69,255,.5)';x.lineWidth=3;x.stroke();x.restore();
  if(g)for(let yy=0;yy<ROWS;yy++)for(let xx=0;xx<COLS;xx++)if(g.board[yy][xx])block(x,bx+xx*cs,by+yy*cs,cs,COLORS[g.board[yy][xx]]);
  // marca
  const ic=await loadIcon();const lx=70;
  if(ic){x.save();rr(x,lx,80,96,96,22);x.clip();x.drawImage(ic,lx,80,96,96);x.restore()}
  x.textBaseline='alphabetic';x.font='900 64px system-ui,-apple-system,Segoe UI,Roboto,sans-serif';x.fillStyle='#ece7ff';x.fillText('Bloq',lx+116,150);
  const bq=x.measureText('Bloq').width,gr=x.createLinearGradient(lx+116+bq,0,lx+116+bq+160,0);gr.addColorStop(0,'#9945FF');gr.addColorStop(1,'#14F195');x.fillStyle=gr;x.fillText('Drop',lx+116+bq,150);
  // puntaje
  x.fillStyle='#a79dcc';x.font='700 34px system-ui,-apple-system,Segoe UI,Roboto,sans-serif';x.fillText('MI PUNTAJE',lx,330);
  const sc=g?g.score.toLocaleString('es'):'0';let fs=150;x.font=`900 ${fs}px system-ui,-apple-system,Segoe UI,Roboto,sans-serif`;
  while(x.measureText(sc).width>bx-lx-40&&fs>60){fs-=8;x.font=`900 ${fs}px system-ui,-apple-system,Segoe UI,Roboto,sans-serif`}
  x.fillStyle='#ffffff';x.fillText(sc,lx,330+fs*.95);
  let yy=330+fs*.95+70;x.font='700 38px system-ui,-apple-system,Segoe UI,Roboto,sans-serif';x.fillStyle='#d4ccf0';
  x.fillText(`Nivel ${g?g.level:1}  ·  ${g?g.lines:0} líneas`,lx,yy);
  if(lastResult&&lastResult.ok&&!lastResult.flagged){yy+=80;x.fillStyle='rgba(250,204,21,.14)';rr(x,lx,yy-50,380,70,35);x.fill();x.strokeStyle='rgba(250,204,21,.6)';x.lineWidth=2;x.stroke();x.fillStyle='#facc15';x.font='800 36px system-ui,-apple-system,Segoe UI,Roboto,sans-serif';x.fillText(`🏆 #${lastResult.rankApprox} de hoy`,lx+28,yy-3)}
  // llamada
  x.fillStyle='#ffffff';x.font='900 52px system-ui,-apple-system,Segoe UI,Roboto,sans-serif';x.fillText('¿Me superas?',lx,H-190);
  x.fillStyle='#14F195';x.font='700 30px system-ui,-apple-system,Segoe UI,Roboto,sans-serif';x.fillText('beticobetico.github.io/bloqdrop',lx,H-130);
  x.fillStyle='#a79dcc';x.font='600 26px system-ui,-apple-system,Segoe UI,Roboto,sans-serif';x.fillText(`Ranking diario · ${CONFIG.PRIZE} al #1`,lx,H-86);
  const url=c.toDataURL('image/png');
  const blob=await new Promise(r=>c.toBlob(r,'image/png'));
  return {url,blob};
}
async function openShare(){
  openModal('shModal');const btns=$('shBtns'),msg=$('shMsg');msg.textContent='';btns.innerHTML='<div class="empty" style="grid-column:1/-1">Creando imagen…</div>';

// ---------- layout ----------
function setupCanvas(c,ctx,w,h){const dpr=Math.min(3,window.devicePixelRatio||1);c.style.width=w+'px';c.style.height=h+'px';c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
function layout(){
  const W=$('play').getBoundingClientRect().width;
  SIDE=Math.floor(Math.max(60,Math.min(80,W*.18)));STRIPH=Math.round(SIDE*.7);
  setupCanvas(holdC,hctx,SIDE,STRIPH);$('bestBox').style.width=SIDE+'px';
  NEXTW=Math.max(80,Math.floor(W-2*SIDE-18));setupCanvas(nextC,nctx,NEXTW,STRIPH);
  const r=$('boardArea').getBoundingClientRect();
  CELL=Math.max(10,Math.floor(Math.min(r.height/ROWS,r.width/COLS)));
  setupCanvas(boardC,bctx,CELL*COLS,CELL*ROWS);
}
window.addEventListener('resize',layout);

// ---------- dibujo ----------
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function block(c,x,y,s,color,alpha=1){c.globalAlpha=alpha;const r=Math.max(2,s*.18);c.fillStyle=color;rr(c,x+1,y+1,s-2,s-2,r);c.fill();
  const gr=c.createLinearGradient(0,y,0,y+s);gr.addColorStop(0,'rgba(255,255,255,.35)');gr.addColorStop(.5,'rgba(255,255,255,0)');gr.addColorStop(1,'rgba(0,0,0,.22)');c.fillStyle=gr;rr(c,x+1,y+1,s-2,s-2,r);c.fill();c.globalAlpha=1}
function draw(){
  const W=CELL*COLS,H=CELL*ROWS,c=bctx;
  c.fillStyle='#100b1f';c.fillRect(0,0,W,H);
  c.strokeStyle='rgba(153,69,255,.08)';c.lineWidth=1;c.beginPath();
  for(let x=1;x<COLS;x++){c.moveTo(x*CELL+.5,0);c.lineTo(x*CELL+.5,H)}for(let y=1;y<ROWS;y++){c.moveTo(0,y*CELL+.5);c.lineTo(W,y*CELL+.5)}c.stroke();
  if(!g){drawMini(hctx,SIDE,STRIPH,[],false);drawMini(nctx,NEXTW,STRIPH,[],false);return}
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(g.board[y][x])block(c,x*CELL,y*CELL,CELL,COLORS[g.board[y][x]]);
  if(g.clearing){const p=g.clearing.t/E.CLEAR_TICKS;c.fillStyle=`rgba(255,255,255,${.9*(1-p)})`;g.clearing.rows.forEach(y=>c.fillRect(0,y*CELL,W,CELL))}
  const cur=g.cur;
  if(cur){
    const gy=g.ghostY(),col=COLORS[cur.t];
    cur.m.forEach((r,y)=>r.forEach((v,x)=>{if(!v||gy+y<0)return;const px=(cur.x+x)*CELL,py=(gy+y)*CELL;c.globalAlpha=.16;c.fillStyle=col;rr(c,px+2,py+2,CELL-4,CELL-4,CELL*.15);c.fill();c.globalAlpha=.6;c.strokeStyle=col;c.lineWidth=1.5;c.stroke();c.globalAlpha=1}));
    cur.m.forEach((r,y)=>r.forEach((v,x)=>{if(v&&cur.y+y>=0)block(c,(cur.x+x)*CELL,(cur.y+y)*CELL,CELL,col)}));
  }
  drawMini(hctx,SIDE,STRIPH,g.hold?[g.hold]:[],!g.canHold);
  drawMini(nctx,NEXTW,STRIPH,g.queue.slice(0,3),false);
}
function drawMini(c,w,h,types,dim){
  c.clearRect(0,0,w,h);if(!types.length)return;
  const slot=w/types.length,s=Math.floor(Math.min(slot/5,h/3.2));
  types.forEach((t,i)=>{const m=E.SHAPES[t];let minX=9,maxX=-1,minY=9,maxY=-1;
    m.forEach((r,y)=>r.forEach((v,x)=>{if(v){minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y)}}));
    const pw=(maxX-minX+1)*s,ph=(maxY-minY+1)*s,ox=i*slot+(slot-pw)/2,oy=(h-ph)/2;
    m.forEach((r,y)=>r.forEach((v,x)=>{if(v)block(c,ox+(x-minX)*s,oy+(y-minY)*s,s,dim?'#4b4466':COLORS[t],i===0||types.length===1?1:.75)}))});
}

// ---------- controles ----------
let held={};
const REPEAT={left:ARR,right:ARR,down:SOFT_ARR};
const CODE={left:A.LEFT,right:A.RIGHT,down:A.SOFT,drop:A.HARD,rotl:A.CCW,rotr:A.CW,hold:A.HOLD};
function press(a){if(REPEAT[a]){if(held[a])return;if(a==='left')delete held.right;if(a==='right')delete held.left;held[a]={t:0,on:false}}act(CODE[a])}
function release(a){delete held[a]}
function tickHeld(dt){for(const a in held){const h=held[a];h.t+=dt;const delay=a==='down'?0:DAS;
  if(!h.on){if(h.t>=Math.max(delay,REPEAT[a])){h.on=true;h.t=0;act(CODE[a])}}else while(h.t>=REPEAT[a]){h.t-=REPEAT[a];act(CODE[a])}}}
document.querySelectorAll('#controls button').forEach(b=>{const a=b.dataset.act;
  b.addEventListener('pointerdown',e=>{e.preventDefault();ensureAudio();if(state==='menu'){newGame();return}if(state!=='play')return;try{b.setPointerCapture(e.pointerId)}catch(_){}b.classList.add('on');press(a)});
  ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>{b.classList.remove('on');release(a)}))});
const KEYS={ArrowLeft:'left',ArrowRight:'right',ArrowDown:'down',ArrowUp:'rotr',KeyX:'rotr',KeyZ:'rotl',Space:'drop',KeyC:'hold',ShiftLeft:'hold'};
document.addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT')return;ensureAudio();
  if(e.code==='KeyP'||e.code==='Escape'){state==='play'?pause():resume();return}
  if(state==='menu'||state==='over'){if(e.code==='Enter'){e.preventDefault();newGame()}return}
  const a=KEYS[e.code];if(!a)return;e.preventDefault();if(e.repeat)return;press(a)});
document.addEventListener('keyup',e=>{const a=KEYS[e.code];if(a)release(a)});
let gs=null;
wrap.addEventListener('pointerdown',e=>{ensureAudio();if(state!=='play')return;const now=performance.now();
  gs={x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,t:now,lastY:e.clientY,lastT:now,vy:0,axis:null};try{wrap.setPointerCapture(e.pointerId)}catch(_){}});
wrap.addEventListener('pointermove',e=>{if(!gs||state!=='play')return;
  if(!gs.axis){const tx=e.clientX-gs.sx,ty=e.clientY-gs.sy;if(Math.hypot(tx,ty)>12)gs.axis=Math.abs(tx)>Math.abs(ty)?'x':'y'}
  const step=CELL*.85;
  if(gs.axis==='x'){while(e.clientX-gs.x>=step){act(A.RIGHT);gs.x+=step}while(gs.x-e.clientX>=step){act(A.LEFT);gs.x-=step}}
  else if(gs.axis==='y'){while(e.clientY-gs.y>=step*1.2){act(A.SOFT);gs.y+=step*1.2}}
  const now=performance.now(),d=now-gs.lastT;if(d>0)gs.vy=.6*((e.clientY-gs.lastY)/d)+.4*gs.vy;gs.lastY=e.clientY;gs.lastT=now});
wrap.addEventListener('pointerup',e=>{if(!gs)return;const G=gs;gs=null;if(state!=='play')return;const dy=e.clientY-G.sy,dt=performance.now()-G.t;
  if(G.axis==='y'&&G.vy>.7&&dy>CELL*1.5)act(A.HARD);else if(G.axis==='y'&&dy<-CELL*2.5)act(A.HOLD);
  else if(!G.axis&&dt<350){const r=wrap.getBoundingClientRect();act(e.clientX<r.left+r.width/2?A.CCW:A.CW)}});
wrap.addEventListener('pointercancel',()=>{gs=null});

// ---------- bucle: pasos fijos de 1/60 s ----------
let last=performance.now();
function frame(now){
  const dt=Math.min(100,now-last);last=now;
  if(state==='play'&&g){
    tickHeld(dt);
    acc=Math.min(acc+dt,250);
    while(acc>=STEP&&!g.over){g.step();acc-=STEP}
    handleEvents();
    if(g.over)gameOver();
  }
  draw();requestAnimationFrame(frame);
}
layout();updateHUD();menu();requestAnimationFrame(frame);
if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
})();
</script>
